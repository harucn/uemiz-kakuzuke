# options は画面に出す順に書く。label は会場で配るものに書いたラベル（A・B・C）。rank 1 が正解（mode を書かない問題では最も高価なもの）
title: "一般人 格付けチェック"
rules: # ゲームのルール。タイトル画面の次のルール画面に、書いた順に出る（参加者にも見える）。省略するとルール画面を出さない
  - 全4問、各テーブル対抗のチーム戦です
  - A・B・Cから、答えを一つ選んでください
  - テーブルで相談して、答えを決めましょう
prizes: # 正解数で決まるランクと景品。ルール画面の次の画面に、上のランクから書いた順に出る（参加者にも見える）。省略すると画面を出さない
  - { rank: 1流, condition: 4問正解, prize: 景品を3つ }
  - { rank: 普通, condition: 3-2問正解, prize: 景品を2つ }
  - { rank: 3流, condition: 1問以下, prize: 景品を1つ }
questions:
  - title: リンゴジュース
    description: A,B,C の中で「となみ野りんご100%ジュース」はどれ？
    explanation: となみ野りんごは富山県砺波市で作られているブランドりんご。そのりんごを贅沢に丸ごと搾った果汁100% ジュースです。
    options:
      - { label: C, image: apple_super.png, note: スーパーの100% ジュース, rank: 2 }
      - { label: B, image: apple_tonamino.jpg, note: となみ野りんご100% ジュース, rank: 1 }
      - { label: A, image: apple_qoo.jpg, note: Qoo りんご, rank: 3 }

  - title: チョコレート
    description: A,B,C の中で「クーベルチュールチョコレート」はどれ？
    explanation: 横井チョコレートは福井県福井市のチョコレート専門店。国際規格を満たしたクーベルチュールチョコレートを使用し、カカオバター本来のなめらかな口どけと深いコクが特徴です。
    options:
      - { label: A, image: choco_ghana.png, note: "Lotte\nガーナミルク", rank: 2 }
      - { label: B, image: choco_yokoi.png, note: "横井チョコレート\nクーベルチュールチョコレート" , rank: 1 }
      - { label: C, image: choco_chocoka.jpg, note: "チョコか？", rank: 3 }

  - title: 日本酒
    description: A,B,C の中で「立山 純米大吟醸 雨晴」はどれ？
    explanation: 雨晴は富山県砺波市の立山酒造が造る純米大吟醸。お米を37%まで磨き、華やかな吟醸香と米の旨味、滑らかな喉越しが特徴です。
    options:
      - { label: B, image: sake_maru.jpg, note: 白鶴 まる, rank: 2 }
      - { label: C, image: sake_tateyama_junmai.jpeg, note: "立山\n純米大吟醸 雨晴" , rank: 1 }
      - { label: A, image: sake_tateyama_onecup.png, note: 立山 ワンカップ, rank: 3 }

  - mode: photo # 写真当て: A・B・C を発表前から出す。note は書かず、caption（誰の写真か）を正解発表後に出す
    title: 子どもの頃の写真
    description: A,B,C の中で「新婦の子どもの頃の写真」はどれ？
    explanation: 新郎は当てられたかな
    options:
      - { label: A, image: little_miz.jpg, caption: "新婦\n上田祐佳里", rank: 1 }
      - { label: B, image: little_sug.jpg, caption: "新郎新婦友人\n杉本愛優花", rank: 2 }
      - { label: C, image: little_kyo.jpg, caption: "新郎新婦友人\n京谷茜", rank: 3 }
